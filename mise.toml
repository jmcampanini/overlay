min_version = "2026.1.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
goreleaser = "2.18.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
# Go's default GOTOOLCHAIN=auto lets it download and run whatever toolchain
# go.mod asks for. local pins execution to the Go that mise installed, so
# mise.toml is the only place the toolchain version is decided.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build build/overlay with git-derived version metadata."
run = '''
version="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')}"
mkdir -p build
go build -trimpath -buildvcs=false -ldflags "-X github.com/jmcampanini/overlay/cmd.Version=${version}" -o build/overlay .
'''

[tasks.install]
description = "Install the CLI."
run = "go install ."

[tasks.test]
description = "Run all tests uncached with the race detector."
run = "go test -count=1 -race ./..."

[tasks.lint]
description = "Run static analysis."
run = "golangci-lint run ./..."

[tasks.lint-fix]
description = "Run static analysis with --fix."
run = "golangci-lint run --fix ./..."

[tasks.fmt]
description = "Format Go source files."
run = "golangci-lint fmt"

[tasks.fmt-check]
description = "Verify formatting without changing files."
run = "golangci-lint fmt --diff"

[tasks.tidy]
description = "Apply go mod tidy."
run = "go mod tidy"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy without changing them."
run = "go mod tidy -diff"

[tasks.version-check]
description = "Verify the built binary reports the injected version."
depends = ["build"]
run = '''
version="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')}"
case "$version" in
  unknown|n/a|"") echo "degenerate version identity: '$version'"; exit 1;;
esac
out="$(build/overlay --version)"
if [ "$out" != "overlay version $version" ]; then
  echo "version mismatch: got '$out', want 'overlay version $version'"
  exit 1
fi
'''

[tasks.vuln]
description = "Check dependencies and reachable code for known vulnerabilities."
run = "govulncheck ./..."

# check is read-only: it must leave the tracked tree unchanged and create
# nothing outside ignored paths. CI diffs `git status` before and after it.
# Add report-only tasks here; fixers (fmt, lint-fix, tidy) stay out.
[tasks.check]
description = "Run the complete local verification contract."
depends = ["fmt-check", "tidy-check", "lint", "test", "version-check", "vuln"]

[tasks.release-snapshot]
description = "Build release archives into dist/ with GoReleaser without publishing."
run = [
  "goreleaser check",
  "goreleaser release --snapshot --clean",
]

# release publishes: it creates the GitHub Release and pushes the Homebrew
# cask. Only the Release workflow runs it, on a v* tag.
[tasks.release]
description = "Build and publish the release for the checked-out tag (Release workflow only)."
run = """
if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
  echo "release publishes artifacts and must run from the Release workflow; use 'mise run release-snapshot' locally"
  exit 1
fi
goreleaser release --clean
"""

[tasks.clean]
description = "Remove build artifacts and the Go test cache."
run = [
  "rm -rf build dist",
  "go clean -testcache",
]
